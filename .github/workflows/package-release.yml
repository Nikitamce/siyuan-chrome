name: Build extension ZIP

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Validate extension manifest
        run: |
          node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (!manifest.manifest_version || !manifest.name || !manifest.version) throw new Error('manifest.json is missing required fields'); console.log('Packaging SiYuan extension version ' + manifest.version);"

      - name: Create extension ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          SAFE_TAG="${RELEASE_TAG//\//-}"
          ZIP_NAME="siyuan-chrome-${SAFE_TAG}.zip"
          STAGING_DIR="${RUNNER_TEMP}/siyuan-chrome-extension"

          mkdir -p "$STAGING_DIR"

          # Keep extension runtime files; omit development and CI files.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            ./ "$STAGING_DIR/"

          (
            cd "$STAGING_DIR"
            zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Created $ZIP_NAME"

      - name: Upload ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.zip_name }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
