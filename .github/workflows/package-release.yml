name: Build extension ZIP

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag to create or update with the ZIP (leave empty to build an Actions test artifact)
        required: false
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Validate extension manifest
        run: |
          node -e "const fs = require('node:fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (!manifest.manifest_version || !manifest.name || !manifest.version) throw new Error('manifest.json is missing required fields'); console.log('Packaging SiYuan extension version ' + manifest.version);"

      - name: Create extension ZIP
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          SAFE_TAG="${RELEASE_TAG//\//-}"
          ZIP_NAME="siyuan-chrome-${SAFE_TAG}.zip"
          STAGING_DIR="${RUNNER_TEMP}/siyuan-chrome-extension"
          mkdir -p "$STAGING_DIR"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='.gitignore' \
            ./ "$STAGING_DIR/"

          (
            cd "$STAGING_DIR"
            zip -qr "$GITHUB_WORKSPACE/$ZIP_NAME" .
          )

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Created $ZIP_NAME"

      - name: Create or update GitHub Release with ZIP
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SiYuan Chrome Extension $RELEASE_TAG" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx "$ZIP_NAME"

      - name: Upload ZIP as a test artifact
        if: "!startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release' && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')"
        uses: actions/upload-artifact@v4
        with:
          name: siyuan-chrome-extension-zip
          path: ${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
