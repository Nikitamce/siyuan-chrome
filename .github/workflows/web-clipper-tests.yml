name: Web clipper regression tests

on:
  push:
    branches:
      - feat/web-clipper-review-fixes
      - feat/popup-element-picker
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
